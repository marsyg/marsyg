name: Update ASCII Banner

on:
  schedule:
    - cron: '0 0 * * *'   # daily at midnight UTC
  workflow_dispatch:       # allows manual trigger from Actions tab
  push:
    branches: [main]

jobs:
  update-banner:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install figlet
        run: sudo apt-get update && sudo apt-get install -y figlet

      - name: Generate ASCII banner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: bash scripts/generate-ascii.sh

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ascii-banner.txt
          git diff --staged --quiet || git commit -m "chore: update ascii banner [skip ci]"
          git push
